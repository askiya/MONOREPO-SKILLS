name: "❓ Pertanyaan"
description: Pertanyaan seputar materi atau praktik
labels: ["question"]
body:
  - type: input
    id: os
    attributes:
      label: Sistem Operasi
      placeholder: Windows 11 / macOS Sonoma / Ubuntu 24
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: AI Agent yang dipakai
      placeholder: Antigravity / Cursor / Claude Code / dll
    validations:
      required: true
  - type: input
    id: bab
    attributes:
      label: Bab/file yang sedang dikerjakan
      placeholder: docs/04-build-frontend/01-...
    validations:
      required: true
  - type: textarea
    id: pertanyaan
    attributes:
      label: Pertanyaan
      description: Jelaskan sejelas mungkin. Jangan hanya "gabisa".
    validations:
      required: true
  - type: textarea
    id: sudah-dicoba
    attributes:
      label: Sudah dicoba
      description: Apa saja yang sudah dilakukan sebelum bertanya?
  - type: checkboxes
    id: sensor
    attributes:
      label: Konfirmasi
      options:
        - label: Saya sudah memastikan tidak ada password/API key/secret di pertanyaan ini.
          required: true
